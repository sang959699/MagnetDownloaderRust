# MagnetDownloader (Rust) + aria2, all on a Windows host with Docker Desktop.
#
# Bind mounts use Windows paths (D:\...) which Docker Desktop translates
# automatically. The download root and config folder are mounted into the
# containers; your external web app (cont5) and SMB keep using the real
# Windows paths untouched.
#
# Before first use, add a PathMapping to D:\MagnetDownloader\Config\Config.json:
#   "PathMapping": { "D:\\HttpSharing": "/data" }
# and set aria_json_rpc_url to http://aria2:80/jsonrpc (plain http, port 80)
# and token to match the aria2 service below. RPC_SECRET here, rpc-secret in
# aria2.conf, and Config.json's aria_json_rpc_token must all be identical.
# NOTE: this image ignores rpc-certificate/rpc-listen-all/rpc-secure in
# aria2.conf (Caddy terminates TLS and proxies RPC on port 80).

services:
  aria2:
    image: wahyd4/aria2-ui:latest
    container_name: aria2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      # ENABLE_AUTH=false: the tool sends no HTTP basic-auth header, only the
      # token: JSON-RPC param, so Caddy must not demand basic auth.
      - ENABLE_AUTH=false
      # RPC secret token from .env (gitignored). Must match rpc-secret in
      # aria2.conf and Config.json's aria_json_rpc_token.
      - RPC_SECRET=${RPC_SECRET}
      - ENABLE_RCLONE=false
      - ENABLE_FILEBROWSER=false
      - ENABLE_APP_CHECKER=false
    volumes:
      # Real Windows download root -> container path (matches PathMapping:
      # D:\\HttpSharing -> /data). Default subfolder (AnimeDL) is set in
      # aria2.conf via dir=.
      - "D:\\HttpSharing:/data"
      # aria2's config folder. Must hold aria2.conf, aria2.session and the two
      # hook scripts (auto-upload.sh, aria2-sample-hook.sh) the conf references;
      # the image runs your aria2.conf verbatim (no dir= rewrite).
      - "D:\\MagnetDownloader\\aria2:/app/conf"
    ports:
      # Caddy web port; proxies the RPC at /jsonrpc on container port 80.
      # Published to host 6801 so the existing IIS rule 6800 -> 6801 keeps
      # working. Port 80 on the host is left free (used by another app).
      - "6801:80"
      # BT/DHT ports.
      - "6881-6999:6881-6999/tcp"
      - "6881-6999:6881-6999/udp"

  magnetdownloader:
    build: .
    container_name: magnetdownloader
    restart: unless-stopped
    volumes:
      # Your production JSON files (Config.json, DownloadedFile.json,
      # FailedDownloadedFile.json, VideoRegex.json)
      - "D:\\MagnetDownloader\\Config:/app/config"
      # Same download root (as /data) so the tool's PathMapping translation
      # matches aria2's real dir.
      - "D:\\HttpSharing:/data"
    depends_on:
      - aria2
    environment:
      - CONFIG_DIR=/app/config
